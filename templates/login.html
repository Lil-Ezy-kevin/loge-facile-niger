<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - Loge Facile Niger</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#0D1B3E,#1A3A6B);min-height:100vh;display:flex;align-items:center;justify-content:center}
.card{background:#fff;border-radius:20px;padding:2.5rem;width:100%;max-width:380px;box-shadow:0 30px 80px rgba(0,0,0,0.3)}
.logo{font-size:1.4rem;font-weight:800;color:#0D1B3E;text-align:center;margin-bottom:0.3rem}.logo span{color:#F47C20}
.sub{text-align:center;font-size:0.82rem;color:#888;margin-bottom:2rem}
label{display:block;font-size:0.8rem;font-weight:600;color:#0D1B3E;margin-bottom:0.4rem}
input{width:100%;padding:0.85rem 1rem;border:1.5px solid #e0e0e0;border-radius:10px;font-size:0.9rem;outline:none;margin-bottom:1.2rem;transition:border-color 0.2s}
input:focus{border-color:#F47C20}
button{width:100%;padding:1rem;background:#F47C20;color:#fff;border:none;border-radius:100px;font-size:1rem;font-weight:600;cursor:pointer}
button:hover{background:#D4600A}
.error{background:#fff3f0;border:1px solid #ffc2b0;color:#c0392b;padding:0.7rem 1rem;border-radius:10px;font-size:0.83rem;margin-bottom:1rem}
</style></head><body>
<div class="card">
  <div class="logo">Loge<span>Facile</span> Niger</div>
  <div class="sub">Panneau d&#39;administration</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label>Utilisateur</label><input type="text" name="username" required autofocus />
    <label>Mot de passe</label><input type="password" name="password" required />
    <button type="submit">Se connecter</button>
  </form>
</div></body></html>
